# 固定稳定节点名与 cookie；仅部署消息中间件，不接通尚未实现的异步业务。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "rabbitmq-headless"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "rabbitmq"
    app.kubernetes.io/part-of: "videoweb"
  ports:
    -
      name: "amqp"
      port: 5672
      targetPort: "amqp"
    -
      name: "management"
      port: 15672
      targetPort: "management"
  clusterIP: "None"
  publishNotReadyAddresses: true
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "rabbitmq"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "rabbitmq"
    app.kubernetes.io/part-of: "videoweb"
  ports:
    -
      name: "amqp"
      port: 5672
      targetPort: "amqp"
    -
      name: "management"
      port: 15672
      targetPort: "management"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "rabbitmq"
  namespace: "infrastructure"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "rabbitmq"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "rabbitmq"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "rabbitmq"
          imagePullPolicy: "IfNotPresent"
          image: "rabbitmq:4.1.0-management"
          env:
            -
              name: "RABBITMQ_DEFAULT_USER"
              value: "videoweb"
            -
              name: "RABBITMQ_DEFAULT_PASS"
              valueFrom:
                secretKeyRef:
                  name: "rabbitmq-auth"
                  key: "password"
            -
              name: "RABBITMQ_DEFAULT_VHOST"
              value: "video_web"
            -
              name: "RABBITMQ_ERLANG_COOKIE"
              valueFrom:
                secretKeyRef:
                  name: "rabbitmq-auth"
                  key: "erlang-cookie"
            -
              name: "RABBITMQ_NODENAME"
              value: "rabbit@rabbitmq-0.rabbitmq-headless.infrastructure.svc.cluster.local"
            -
              name: "RABBITMQ_USE_LONGNAME"
              value: "true"
          ports:
            -
              name: "amqp"
              containerPort: 5672
            -
              name: "management"
              containerPort: 15672
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "ping"
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "check_running"
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - "rabbitmq-diagnostics"
                - "-q"
                - "ping"
            periodSeconds: 20
            timeoutSeconds: 10
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/rabbitmq"
  serviceName: "rabbitmq-headless"
  podManagementPolicy: "Parallel"
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: "videoweb-longhorn"
        resources:
          requests:
            storage: "2Gi"
