# 单实例持久化 boltdb；由网关注册到项目 Consul，回调必须能访问 Pod 网络。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "dtm-headless"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "dtm"
    app.kubernetes.io/part-of: "videoweb"
  # port 是 Service 通信端口；targetPort 按名称匹配 Pod 中的 containerPort，不是另一个 Service。
  # 未指定 type 时默认为 ClusterIP，不会将这些端口发布成 节点 IP:端口；访问仍受网络策略限制。
  ports:
    -
      name: "http"
      # DTM HTTP API/管理入口，不是业务网关的 HTTP 端口。
      port: 36789
      targetPort: "http"
    -
      name: "grpc"
      # DTM gRPC 事务协调入口，Saga 回调还需能访问业务 RPC。
      port: 36790
      targetPort: "grpc"
  # None 表示 Headless Service，不分配虚拟 IP，DNS 直接发布 Pod 地址；不是公网入口。
  clusterIP: "None"
  # 引导阶段即使 Pod 未 Ready 也发布其地址，避免成员发现/初始化等待就绪形成循环；不能据此判断业务健康。
  publishNotReadyAddresses: true
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "dtm"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "dtm"
    app.kubernetes.io/part-of: "videoweb"
  # port 是 Service 通信端口；targetPort 按名称匹配 Pod 中的 containerPort，不是另一个 Service。
  # 未指定 type 时默认为 ClusterIP，不会将这些端口发布成 节点 IP:端口；访问仍受网络策略限制。
  ports:
    -
      name: "http"
      # DTM HTTP API/管理入口，不是业务网关的 HTTP 端口。
      port: 36789
      targetPort: "http"
    -
      name: "grpc"
      # DTM gRPC 事务协调入口，Saga 回调还需能访问业务 RPC。
      port: 36790
      targetPort: "grpc"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "dtm"
  namespace: "infrastructure"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "dtm"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "dtm"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "dtm"
          imagePullPolicy: "IfNotPresent"
          image: "yedf/dtm:1.19.0"
          workingDir: "/var/lib/dtm"
          env:
            -
              # 选择 DTM 事务状态存储后端；boltdb 使用本地文件，数据保留取决于数据卷的生命周期。
              name: "STORE_DRIVER"
              value: "boltdb"
          # 仅声明容器端口名称/协议，供 Service 和探针引用；不会让进程自动监听，也不发布宿主机端口。
          ports:
            -
              name: "http"
              containerPort: 36789
            -
              name: "grpc"
              containerPort: 36790
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # 只等待 DTM gRPC 监听，不验证事务回调或 barrier 数据库。
          # startup 成功前不执行 readiness/liveness；连续失败达到 failureThreshold 后重启容器。
          # periodSeconds 是间隔秒数，timeoutSeconds 是单次超时秒数，failureThreshold 是连续失败次数。
          startupProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          # gRPC 端口可连接不等于 Saga 回调、Consul 发现和补偿操作已经联调成功。
          # 失败只标记 Pod 未就绪，不重启容器；普通 Service 会按就绪状态选择后端。
          readinessProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # 只检查 DTM gRPC 监听，不能自动补回已经丢失的事务状态。
          # 连续失败达到阈值才重启容器，不等于删除或重建 Pod；数据是否保留仍由挂载卷决定。
          livenessProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            -
              name: "data"
              # DTM 本地事务状态目录；丢失未完成事务时，不能承诺自动补偿恢复。
              mountPath: "/var/lib/dtm"
  # 关联上方 Headless Service，为 Pod 提供稳定 DNS/身份；稳定名称不代表 emptyDir 数据会保留。
  serviceName: "dtm-headless"
  podManagementPolicy: "Parallel"
  # 为每个 StatefulSet Pod 创建独立 data PVC，相同序号的 Pod 重建后可重新挂载原卷；不是多 Pod 共享目录。
  # 保留/删除需检查 PVC 保留策略；该字段通常不能原地移除，切换 emptyDir 前须先备份并选择性重建。
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        # RWO 表示单节点读写挂载，不等于仅允许一个 Pod；它本身不提供应用级高可用。
        accessModes:
          - "ReadWriteOnce"
        # 使用原方案的项目专用 Longhorn StorageClass 制备卷，依赖已安装的存储驱动；单节点方案不使用它。
        storageClassName: "videoweb-longhorn"
        resources:
          requests:
            storage: "1Gi"
