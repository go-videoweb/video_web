# 开发链路追踪，内存存储，重启后 trace 不保留。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "jaeger"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "jaeger"
    app.kubernetes.io/part-of: "videoweb"
  ports:
    -
      name: "ui"
      port: 16686
      targetPort: "ui"
    -
      name: "collector"
      port: 14268
      targetPort: "collector"
    -
      name: "grpc"
      port: 14250
      targetPort: "grpc"
    -
      name: "otlp-grpc"
      port: 4317
      targetPort: "otlp-grpc"
    -
      name: "otlp-http"
      port: 4318
      targetPort: "otlp-http"
    -
      name: "zipkin"
      port: 9411
      targetPort: "zipkin"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "jaeger"
  namespace: "infrastructure"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "jaeger"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "jaeger"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "jaeger"
          imagePullPolicy: "IfNotPresent"
          image: "jaegertracing/all-in-one:1.67.0"
          env:
            -
              name: "COLLECTOR_OTLP_ENABLED"
              value: "true"
            -
              name: "COLLECTOR_ZIPKIN_HOST_PORT"
              value: ":9411"
            -
              name: "MEMORY_MAX_TRACES"
              value: "10000"
          ports:
            -
              name: "ui"
              containerPort: 16686
            -
              name: "collector"
              containerPort: 14268
            -
              name: "grpc"
              containerPort: 14250
            -
              name: "otlp-grpc"
              containerPort: 4317
            -
              name: "otlp-http"
              containerPort: 4318
            -
              name: "zipkin"
              containerPort: 9411
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          startupProbe:
            tcpSocket:
              port: "ui"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: "ui"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: "ui"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
  strategy:
    type: "Recreate"
