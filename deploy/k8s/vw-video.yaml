# 固定单副本和 Recreate，避免源码写死的 Consul 实例 ID 被并行实例覆盖；镜像需先构建并分发。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "vw-video"
  namespace: "videoweb"
spec:
  selector:
    app.kubernetes.io/name: "vw-video"
    app.kubernetes.io/part-of: "videoweb"
  ports:
    -
      name: "grpc"
      port: 9002
      targetPort: "grpc"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "vw-video"
  namespace: "videoweb"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "vw-video"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "vw-video"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "vw-video"
          imagePullPolicy: "IfNotPresent"
          image: "videoweb/vw_video:k3s"
          command:
            - "/app/service"
          args:
            - "-conf"
            - "/etc/videoweb/config.yaml"
          env:
            -
              name: "CONSUL_HTTP_ADDR"
              value: "http://consul.infrastructure.svc.cluster.local:8500"
            -
              name: "GOMEMLIMIT"
              value: "768MiB"
            -
              name: "GOMAXPROCS"
              value: "2"
          ports:
            -
              name: "grpc"
              containerPort: 9002
          volumeMounts:
            -
              name: "config"
              mountPath: "/etc/videoweb"
              readOnly: true
            -
              name: "resources"
              mountPath: "/workspace/resources"
            -
              name: "tmp"
              mountPath: "/tmp"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        -
          name: "config"
          secret:
            secretName: "vw-video-config"
        -
          name: "resources"
          persistentVolumeClaim:
            claimName: "videoweb-resources"
        -
          name: "tmp"
          emptyDir: {}
      initContainers:
        -
          name: "prepare-resources"
          image: "videoweb/vw_video:k3s"
          command:
            - "sh"
            - "-ec"
            - "mkdir -p /workspace/resources/default /workspace/resources/tmp; if [ ! -f /workspace/resources/default/avatar.jpg ]; then cp /seed/avatar.jpg /workspace/resources/default/avatar.jpg; fi"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            -
              name: "resources"
              mountPath: "/workspace/resources"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  strategy:
    type: "Recreate"
