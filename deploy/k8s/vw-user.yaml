# 固定单副本和 Recreate，避免源码写死的 Consul 实例 ID 被并行实例覆盖；镜像需先构建并分发。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "vw-user"
  namespace: "videoweb"
spec:
  selector:
    app.kubernetes.io/name: "vw-user"
    app.kubernetes.io/part-of: "videoweb"
  # port 是 Service 通信端口；targetPort 按名称匹配 Pod 中的 containerPort，不是另一个 Service。
  # 未指定 type 时默认为 ClusterIP，不会将这些端口发布成 节点 IP:端口；访问仍受网络策略限制。
  ports:
    -
      name: "grpc"
      # 用户服务内部 gRPC，供网关/视频服务调用，不是浏览器 HTTP API。
      port: 9001
      targetPort: "grpc"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "vw-user"
  namespace: "videoweb"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "vw-user"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "vw-user"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      containers:
        -
          name: "vw-user"
          imagePullPolicy: "IfNotPresent"
          image: "videoweb/vw_user:k3s"
          command:
            - "/app/service"
          args:
            - "-conf"
            - "/etc/videoweb/config.yaml"
          env:
            -
              # Consul API 默认地址，供 util/resolver 的 DefaultConfig 使用，避免 Saga 查址误连 localhost。
              name: "CONSUL_HTTP_ADDR"
              value: "http://consul.infrastructure.svc.cluster.local:8500"
            -
              # Go 运行时管理内存的软限制（此处单位 MiB）；不是容器硬上限，也不约束 ffmpeg 等子进程。
              name: "GOMEMLIMIT"
              value: "256MiB"
            -
              # 可同时执行 Go 代码的最大 CPU 数；不是 goroutine 数，也不是容器 CPU 配额。
              name: "GOMAXPROCS"
              value: "2"
          # 仅声明容器端口名称/协议，供 Service 和探针引用；不会让进程自动监听，也不发布宿主机端口。
          ports:
            -
              name: "grpc"
              containerPort: 9001
          volumeMounts:
            -
              name: "config"
              # 以文件方式提供 Kratos config.yaml；配置中的环境占位符不会自动展开。
              mountPath: "/etc/videoweb"
              readOnly: true
            -
              name: "resources"
              # 默认头像和用户上传头像目录；数据库记录路径并不等于备份了这些文件。
              # 必须与镜像保留的 /workspace 源码路径一致；只改挂载路径不会改变 runtime.Caller 的定位逻辑。
              mountPath: "/workspace/resources"
            -
              name: "tmp"
              # 进程临时目录，与 /workspace/resources/tmp 不是同一个目录。
              mountPath: "/tmp"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "384Mi"
          # 只等待业务 gRPC端口监听，不验证数据库、schema 和完整下游调用链。
          # startup 成功前不执行 readiness/liveness；连续失败达到 failureThreshold 后重启容器。
          # periodSeconds 是间隔秒数，timeoutSeconds 是单次超时秒数，failureThreshold 是连续失败次数。
          startupProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          # 只检查gRPC TCP 监听，不等于登录、上传、播放或 Saga 已验证成功。
          # 失败只标记 Pod 未就绪，不重启容器；普通 Service 会按就绪状态选择后端。
          readinessProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          # 只检查业务监听端口，不检查下游数据库或 RPC；不能用重启替代修复依赖。
          # 连续失败达到阈值才重启容器，不等于删除或重建 Pod；数据是否保留仍由挂载卷决定。
          livenessProbe:
            tcpSocket:
              port: "grpc"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        -
          name: "config"
          # 将应用配置以 Secret 文件提供；挂载更新不等于应用会重新加载，也不自动轮换数据库账号。
          secret:
            secretName: "vw-user-config"
        -
          name: "resources"
          # 引用原方案的共享媒体 PVC，各业务 Pod 看到同一份文件；不是 single-node 方案的独立 emptyDir。
          # 删除 Pod 通常不删除此 PVC；数据保留还取决于 PVC/PV 与存储后端，不能代替备份。
          persistentVolumeClaim:
            claimName: "videoweb-resources"
        -
          name: "tmp"
          # 磁盘型 Pod 临时卷，同一 Pod 内容器重启通常保留，删除/驱逐/重建 Pod 后丢失，不能跨 Pod 共享。
          emptyDir: {}
      # 新 Pod 启动主容器前补齐默认头像和 tmp 目录；不导入历史媒体，同一 Pod 主容器重启通常不重跑。
      initContainers:
        -
          name: "prepare-resources"
          image: "videoweb/vw_user:k3s"
          command:
            - "sh"
            - "-ec"
            - "mkdir -p /workspace/resources/default /workspace/resources/tmp; if [ ! -f /workspace/resources/default/avatar.jpg ]; then cp /seed/avatar.jpg /workspace/resources/default/avatar.jpg; fi"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            -
              name: "resources"
              # 默认头像和用户上传头像目录；数据库记录路径并不等于备份了这些文件。
              # 必须与镜像保留的 /workspace 源码路径一致；只改挂载路径不会改变 runtime.Caller 的定位逻辑。
              mountPath: "/workspace/resources"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  strategy:
    type: "Recreate"
