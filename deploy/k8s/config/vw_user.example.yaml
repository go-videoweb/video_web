# 与 secrets.yaml 中应用账号保持一致；本机配置通过 Secret 挂载，不会展开环境占位符。
server:
  grpc: {addr: "0.0.0.0:9001", timeout: 120s}
data:
  mysql:
    host: mysql.infrastructure.svc.cluster.local
    port: "3306"
    user: videoweb
    password: CHANGE_ME_MYSQL_APP
    database: vw_user
    max_idle: 5
    max_open: 30
    log_level: 2
  redis_cluster:
    host: redis-0.redis-headless.infrastructure.svc.cluster.local
    port: ["6379"]
    password: CHANGE_ME_REDIS
    dial_timeout: 5s
    read_timeout: 5s
    write_timeout: 5s
    pool_timeout: 5s
    pool_size: 20
    min_idle_conns: 2
    max_retries: 3
  mongo:
    # 当前用户服务只拼接 host/port，因此 host 使用带 userinfo 的 URI authority。
    # 密码须与 app-password 一致且使用不需 URI 转义的随机十六进制字符串。
    host: videoweb:CHANGE_ME_MONGO_APP@mongodb.infrastructure.svc.cluster.local
    port: "27017"
    db: video_web
    password: CHANGE_ME_MONGO_APP
    max_open: 30
    conn_timeout: 10s
registry:
  consul:
    address: consul.infrastructure.svc.cluster.local:8500
    scheme: http
trace:
  endpoint: http://jaeger.infrastructure.svc.cluster.local:14268/api/traces
