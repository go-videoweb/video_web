# 为单个全新 Redis 节点分配全部槽；拒绝已有多成员集群或部分槽状态。
apiVersion: "batch/v1"
kind: "Job"
metadata:
  name: "redis-single-init"
  namespace: "infrastructure"
spec:
  # Job 失败重试上限，也会计入 OnFailure 容器重启；耗尽后标记失败，不能当作无限自动修复。
  backoffLimit: 3
  # 整个 Job 的运行时限，单位秒，含等待依赖；到期会终止仍运行的 Pod 并标记失败。
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "redis-single-init"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      nodeSelector:
        workload: "heavy"
      automountServiceAccountToken: false
      # 失败退出时重启本 Pod 内的容器；成功结束不重启。已完成 Job 不会因数据库 Pod 重建自动重跑。
      restartPolicy: "OnFailure"
      containers:
        -
          name: "redis-single-init"
          image: "redis:7.4.2-alpine"
          # 只为单成员 Redis 的全空槽状态分配全部槽；完整状态可重复检查，多成员/部分槽状态拒绝自动修改。
          command:
            - "sh"
            - "-ec"
            - |-
              set -eu
              host="redis-0.redis-headless.infrastructure.svc.cluster.local"
              until redis-cli -h "$host" ping | grep -q PONG; do sleep 3; done
              info="$(redis-cli -h "$host" cluster info | tr -d '\r')"
              echo "$info" | grep -q '^cluster_known_nodes:1$' || {
                echo "Existing multi-node cluster; inspect manually" >&2; exit 1;
              }
              if echo "$info" | grep -q '^cluster_slots_assigned:0$'; then
                redis-cli -e -h "$host" CLUSTER ADDSLOTSRANGE 0 16383
              elif ! echo "$info" | grep -q '^cluster_slots_assigned:16384$'; then
                echo "Partial slot assignment; inspect manually" >&2; exit 1
              fi
              until redis-cli -h "$host" cluster info | tr -d '\r' | grep -q '^cluster_state:ok$'; do sleep 3; done
              redis-cli -h "$host" cluster info | tr -d '\r' | grep -q '^cluster_size:1$'
          env:
            -
              # redis-cli 的认证密码，供探针/初始化 Job 使用；需与服务端 requirepass 一致。
              # 凭据来源：本命名空间 Secret redis-auth/password；此处只引用，不写入明文。
              name: "REDISCLI_AUTH"
              valueFrom:
                secretKeyRef:
                  name: "redis-auth"
                  key: "password"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
