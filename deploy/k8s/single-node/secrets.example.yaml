# 仅为占位示例；复制到被忽略的 local/secrets.yaml 后填写，默认清单不会应用此文件。
# 密码推荐使用随机十六进制字符串；MySQL 初始化 SQL 与 Mongo URI 需遵守配置说明。
apiVersion: v1
kind: Secret
metadata: {name: mysql-auth, namespace: infrastructure}
type: Opaque
stringData:
  root-password: CHANGE_ME_MYSQL_ROOT
  app-password: CHANGE_ME_MYSQL_APP
---
apiVersion: v1
kind: Secret
metadata: {name: redis-auth, namespace: infrastructure}
type: Opaque
stringData:
  password: CHANGE_ME_REDIS
---
apiVersion: v1
kind: Secret
metadata: {name: mongodb-auth, namespace: infrastructure}
type: Opaque
stringData:
  root-password: CHANGE_ME_MONGO_ROOT
  app-password: CHANGE_ME_MONGO_APP
  # 替换为 openssl rand -base64 756 生成的完整 keyfile，不是登录密码。
  keyfile: CHANGE_ME_MONGO_KEYFILE
---
apiVersion: v1
kind: Secret
metadata: {name: rabbitmq-auth, namespace: infrastructure}
type: Opaque
stringData:
  password: CHANGE_ME_RABBITMQ
  erlang-cookie: CHANGE_ME_RABBIT_COOKIE
---
apiVersion: v1
kind: Secret
metadata: {name: elasticsearch-auth, namespace: infrastructure}
type: Opaque
stringData:
  elastic-password: CHANGE_ME_ELASTIC
  kibana-password: CHANGE_ME_KIBANA
  # 至少 32 个字符，作为本地开发示例共用的持久化加密键。
  kibana-encryption-key: CHANGE_ME_KIBANA_ENCRYPTION_KEY_32_CHARS
