# 项目专用单 server Consul，未启用 ACL，仅供隔离命名空间中的开发服务。
# 数据仅保留在当前 Pod 的磁盘型 emptyDir；Pod 重建会清空，不创建 PVC。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "consul-headless"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "consul"
    app.kubernetes.io/part-of: "videoweb"
  ports:
    -
      name: "http"
      port: 8500
      targetPort: "http"
    -
      name: "server"
      port: 8300
      targetPort: "server"
    -
      name: "serf"
      port: 8301
      targetPort: "serf"
  clusterIP: "None"
  publishNotReadyAddresses: true
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "consul"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "consul"
    app.kubernetes.io/part-of: "videoweb"
  ports:
    -
      name: "http"
      port: 8500
      targetPort: "http"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "consul"
  namespace: "infrastructure"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "consul"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "consul"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      volumes:
        -
          name: "data"
          emptyDir:
            sizeLimit: "1Gi"
      containers:
        -
          name: "consul"
          imagePullPolicy: "IfNotPresent"
          image: "hashicorp/consul:1.20.2"
          args:
            - "agent"
            - "-server"
            - "-bootstrap-expect=1"
            - "-client=0.0.0.0"
            - "-bind=0.0.0.0"
            - "-advertise=$(POD_IP)"
            - "-data-dir=/consul/data"
            - "-ui"
          env:
            -
              name: "POD_IP"
              valueFrom:
                fieldRef:
                  fieldPath: "status.podIP"
          ports:
            -
              name: "http"
              containerPort: 8500
            -
              name: "server"
              containerPort: 8300
            -
              name: "serf"
              containerPort: 8301
            -
              name: "serf-udp"
              containerPort: 8301
              protocol: "UDP"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            tcpSocket:
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: "/v1/status/leader"
              port: "http"
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            -
              name: "data"
              mountPath: "/consul/data"
  serviceName: "consul-headless"
  podManagementPolicy: "Parallel"
