# 项目专用单 server Consul，未启用 ACL，仅供隔离命名空间中的开发服务。
# 数据仅保留在当前 Pod 的磁盘型 emptyDir；Pod 重建会清空，不创建 PVC。
apiVersion: "v1"
kind: "Service"
metadata:
  name: "consul-headless"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "consul"
    app.kubernetes.io/part-of: "videoweb"
  # port 是 Service 通信端口；targetPort 按名称匹配 Pod 中的 containerPort，不是另一个 Service。
  # 未指定 type 时默认为 ClusterIP，不会将这些端口发布成 节点 IP:端口；访问仍受网络策略限制。
  ports:
    -
      name: "http"
      # Consul HTTP API 与管理 UI，供服务注册、发现和管理使用。
      port: 8500
      targetPort: "http"
    -
      name: "server"
      # Consul 服务端内部 RPC，不是业务客户端入口。
      port: 8300
      targetPort: "server"
    -
      name: "serf"
      # Consul Serf/LAN gossip；本条 Service 端口使用 TCP。
      port: 8301
      targetPort: "serf"
  # None 表示 Headless Service，不分配虚拟 IP，DNS 直接发布 Pod 地址；不是公网入口。
  clusterIP: "None"
  # 引导阶段即使 Pod 未 Ready 也发布其地址，避免成员发现/初始化等待就绪形成循环；不能据此判断业务健康。
  publishNotReadyAddresses: true
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "consul"
  namespace: "infrastructure"
spec:
  selector:
    app.kubernetes.io/name: "consul"
    app.kubernetes.io/part-of: "videoweb"
  # port 是 Service 通信端口；targetPort 按名称匹配 Pod 中的 containerPort，不是另一个 Service。
  # 未指定 type 时默认为 ClusterIP，不会将这些端口发布成 节点 IP:端口；访问仍受网络策略限制。
  ports:
    -
      name: "http"
      # Consul HTTP API 与管理 UI，供服务注册、发现和管理使用。
      port: 8500
      targetPort: "http"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "consul"
  namespace: "infrastructure"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "consul"
      app.kubernetes.io/part-of: "videoweb"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "consul"
        app.kubernetes.io/part-of: "videoweb"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: "heavy"
      terminationGracePeriodSeconds: 60
      volumes:
        -
          name: "data"
          # 磁盘型 Pod 临时卷，同一 Pod 内容器重启通常保留，删除/驱逐/重建 Pod 后丢失，不能跨 Pod 共享。
          # sizeLimit=1Gi 是使用上限，不预分配或预留磁盘；节点磁盘压力仍可能导致驱逐。
          emptyDir:
            sizeLimit: "1Gi"
      containers:
        -
          name: "consul"
          imagePullPolicy: "IfNotPresent"
          image: "hashicorp/consul:1.20.2"
          args:
            - "agent"
            - "-server"
            - "-bootstrap-expect=1"
            - "-client=0.0.0.0"
            - "-bind=0.0.0.0"
            - "-advertise=$(POD_IP)"
            - "-data-dir=/consul/data"
            - "-ui"
          env:
            -
              # 由 Downward API 读取当前 Pod 的 status.podIP，供启动命令公布可达地址；不是 Service 的 ClusterIP。
              name: "POD_IP"
              valueFrom:
                fieldRef:
                  fieldPath: "status.podIP"
          # 仅声明容器端口名称/协议，供 Service 和探针引用；不会让进程自动监听，也不发布宿主机端口。
          ports:
            -
              name: "http"
              containerPort: 8500
            -
              name: "server"
              containerPort: 8300
            -
              name: "serf"
              containerPort: 8301
            -
              name: "serf-udp"
              containerPort: 8301
              protocol: "UDP"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # 只等待 Consul HTTP 端口打开，不保证已选出 leader 或已有服务注册。
          # startup 成功前不执行 readiness/liveness；连续失败达到 failureThreshold 后重启容器。
          # periodSeconds 是间隔秒数，timeoutSeconds 是单次超时秒数，failureThreshold 是连续失败次数。
          startupProbe:
            tcpSocket:
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          # 请求 /v1/status/leader，只依据 HTTP 状态码；不解析响应中的 leader 地址是否为空。
          # 失败只标记 Pod 未就绪，不重启容器；普通 Service 会按就绪状态选择后端。
          readinessProbe:
            httpGet:
              path: "/v1/status/leader"
              port: "http"
            periodSeconds: 10
          # 只检查 HTTP TCP 监听，不验证服务注册表或完整发现链路。
          # 连续失败达到阈值才重启容器，不等于删除或重建 Pod；数据是否保留仍由挂载卷决定。
          livenessProbe:
            tcpSocket:
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            -
              name: "data"
              # Consul 服务端状态目录，包含服务发现所依赖的状态；丢失后需检查服务重新注册。
              mountPath: "/consul/data"
  # 关联上方 Headless Service，为 Pod 提供稳定 DNS/身份；稳定名称不代表 emptyDir 数据会保留。
  serviceName: "consul-headless"
  podManagementPolicy: "Parallel"
