syntax = "proto3";

package gateway.api.v1.video.comment;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

option go_package = "vw_gateway/api/v1/comment/video;video_comment";

service VideoComment {
    rpc CommentVideo(CommentVideoReq) returns (CommentVideoResp) {
        option (google.api.http) = {
            post: "/api/v1/video/{video_id}/comment"
            body: "*"
        };
    }
    rpc GetCommentList(GetCommentListReq) returns (GetCommentListResp) {
        option (google.api.http) = {
            get: "/api/v1/video/{video_id}/comment"
        };
    }
    rpc GetCommentReplies(GetCommentRepliesReq) returns (GetCommentRepliesResp) {
        option (google.api.http) = {
            get: "/api/v1/video/{video_id}/comments/{comment_id}/replies"
        };
    }

    rpc UpvoteComment(UpvoteCommentReq) returns (UpvoteCommentResp) {
        option (google.api.http) = {
            put: "/api/v1/video/{video_id}/comment/{comment_id}/upvote"
            body: "*"
        };
    }
}

message CommentInfo {
    sint64 comment_id                    = 1;
    sint64 publisher_id                  = 2;
    sint64 root_id                       = 3;
    string content                       = 4;
    google.protobuf.Timestamp created_at = 5;
    uint64 upvote_count                  = 6;
    string ip_address                    = 7;
    uint32 cnt_replies                   = 8;
    sint64 parent_id = 9;
    bool is_upvoted = 10;
    CommentReference reference = 11;
}

// CommentReference 返回直接回复对象的完整正文，展示截断由前端负责。
message CommentReference {
    sint64 comment_id = 1;
    sint64 publisher_id = 2;
    string content = 3;
    bool unavailable = 4;
}

message CommentVideoReq {
    sint64 video_id  = 1;
    sint64 parent_id = 2;
    string content   = 3;
}
message CommentVideoResp {
    sint64 comment_id = 1;
}

// CommentCursor 保存上一批最后一条评论的位置，不能跨视频、楼层或排序复用。
message CommentCursor {
    // 所属视频 ID，必须与本次请求一致。
    sint64 video_id = 1;
    // 主评论列表为 0，回复列表为所属主评论 ID。
    sint64 root_id = 2;
    // 排序字段：created_at 或 cnt_upvote。
    string sort_by = 3;
    // 排序方向：asc 或 desc；热度排序只允许 desc。
    string order = 4;
    // 上一批最后一条已返回评论的 ID，用于同值排序。
    sint64 comment_id = 5;
    // 该评论的创建时间；按时间排序时必须提供。
    google.protobuf.Timestamp created_at = 6;
    // 该评论在读取时的点赞数；不是固定的热度快照。
    uint64 upvote_count = 7;
}

message GetCommentListReq {
    sint64 video_id = 1;
    string sort_by  = 4;
    string order    = 5;
    // 首批不传；后续传上一批返回的 next_cursor 对象。
    CommentCursor cursor = 6;
}
message GetCommentListResp {
    repeated CommentInfo comments = 1;
    int32 total_count             = 2;
    // 仅有下一批时返回，否则为空。
    CommentCursor next_cursor = 3;
    bool has_more = 4;
}

message GetCommentRepliesReq {
    sint64 video_id   = 1;
    sint64 comment_id = 2;
    string sort_by    = 5;
    string order      = 6;
    // 首批不传；后续传上一批返回的 next_cursor 对象。
    CommentCursor cursor = 7;
}
message GetCommentRepliesResp {
    repeated CommentInfo replies = 1;
    // 仅有下一批时返回，否则为空。
    CommentCursor next_cursor = 2;
    bool has_more = 3;
}

message UpvoteCommentReq {
    sint64 comment_id = 1;
    sint64 video_id   = 2;

    optional bool liked = 4;
}
message UpvoteCommentResp {
    int32 status_code = 1;
    string message    = 2;
    bool is_upvoted = 3;
    uint64 upvote_count = 4;
}
